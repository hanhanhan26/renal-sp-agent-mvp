<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>肾内科 AI 标准化病人 MVP</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>肾内科 AI 标准化病人 MVP</h1>
      <p>第一天版本：输入主诉，生成一个预设病例开场。</p>
    </header>

    <section class="card">
      <h2>创建病例</h2>

      <label for="complaint">主诉 / 训练目标</label>
      <textarea id="complaint" placeholder="例如：水肿、蛋白尿；血尿；少尿、肌酐升高"></textarea>

      <label for="difficulty">难度</label>
      <select id="difficulty">
        <option value="简单">简单</option>
        <option value="中等" selected>中等</option>
        <option value="偏难">偏难</option>
      </select>

      <button id="generateBtn">生成病例</button>
    </section>

    <section class="card" id="caseResult" style="display: none;">
      <h2>病例已生成</h2>
      <div class="case-info">
        <p><strong>科室：</strong><span id="department"></span></p>
        <p><strong>难度：</strong><span id="caseDifficulty"></span></p>
        <p><strong>患者：</strong><span id="patientInfo"></span></p>
        <p><strong>主诉：</strong><span id="chiefComplaint"></span></p>
      </div>

      <div class="patient-box">
        <p><strong>患者开场：</strong></p>
        <p id="openingStatement"></p>
      </div>
    </section>

    <section class="card" id="chatSection" style="display: none;">
  <h2>问诊对话</h2>

  <div id="chatBox" class="chat-box"></div>

  <div class="chat-input-row">
    <input id="doctorQuestion" type="text" placeholder="请输入医生的问题，例如：你小便有没有泡沫？" />
    <button id="sendQuestionBtn">发送</button>
  </div>

  <button id="finishInterviewBtn" class="secondary-btn">结束问诊并评分</button>
</section>

<section class="card" id="scoringSection" style="display: none;">
  <h2>评分反馈</h2>

  <label for="studentDiagnosis">请输入你的初步诊断</label>
  <input id="studentDiagnosis" type="text" placeholder="例如：肾病综合征" />

  <button id="submitScoreBtn">提交诊断并生成评分</button>

  <div id="scoreResult" class="score-result" style="display: none;">
    <h3>评分报告</h3>

    <p><strong>总分：</strong><span id="totalScore"></span>/100</p>
    <p><strong>问诊得分：</strong><span id="historyScore"></span>/50</p>
    <p><strong>诊断得分：</strong><span id="diagnosisScore"></span>/30</p>
    <p><strong>沟通得分：</strong><span id="communicationScore"></span>/20</p>

    <p><strong>已覆盖问诊要点：</strong></p>
    <ul id="coveredItems"></ul>

    <p><strong>遗漏问诊要点：</strong></p>
    <ul id="missedItems"></ul>

    <p><strong>诊断反馈：</strong></p>
    <p id="diagnosisFeedback"></p>

    <p><strong>改进建议：</strong></p>
    <p id="suggestion"></p>
  </div>
</section>

  </div>

  <script src="./app.js"></script>
</body>
</html>
